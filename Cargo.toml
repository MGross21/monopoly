[package]
name = "monopoly"
version = "0.1.0"
edition = "2024"
description = "Monopoly in your Terminal!"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
rand = "0.10.1"
ratatui = "0.30.2"
ratatui-notifications = "0.1.0"
tui-big-text = "0.8.8"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
